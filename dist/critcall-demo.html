<title>CritCall Demo</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #1c2330;
  --muted: #5d6675;
  --line: #dde1e7;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --crit: #c62828;
  --crit-bg: #fdecec;
  --warn: #b26a00;
  --warn-bg: #fff4e0;
  --ok: #2e7d32;
  --ok-bg: #e8f5e9;
  --soft: #eef1f5;
  --info-bg: #e7effb;
  --covering-bg: #f4f8ff;
  --crit-line: #f0b8b8;
  --topbar: #14213d;
  --topbar-btn: #2c3e66;
  --topbar-line: #3d5287;
  --topbar-ink: #c9d3e6;
  --shadow: rgba(0, 0, 0, .08);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161f; --panel: #1a212d; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2e3746;
    --accent: #6fa2ff; --accent-ink: #0b1220;
    --crit: #ff6b6b; --crit-bg: #3a1c1f; --warn: #f0b450; --warn-bg: #3a2c14; --ok: #5fcf73; --ok-bg: #16301c;
    --soft: #252d3a; --info-bg: #1c2b45; --covering-bg: #17233a; --crit-line: #6b2b2f;
    --topbar: #0b1020; --topbar-btn: #1f2b47; --topbar-line: #34466f; --topbar-ink: #b4c0d6; --shadow: rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161f; --panel: #1a212d; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2e3746;
  --accent: #6fa2ff; --accent-ink: #0b1220;
  --crit: #ff6b6b; --crit-bg: #3a1c1f; --warn: #f0b450; --warn-bg: #3a2c14; --ok: #5fcf73; --ok-bg: #16301c;
  --soft: #252d3a; --info-bg: #1c2b45; --covering-bg: #17233a; --crit-line: #6b2b2f;
  --topbar: #0b1020; --topbar-btn: #1f2b47; --topbar-line: #34466f; --topbar-ink: #b4c0d6; --shadow: rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
h2 { font-size: 20px; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 20px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--topbar); color: #fff;
}
.topbar .brand { color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
.topbar nav { display: flex; gap: 4px; }
.topbar nav a { color: var(--topbar-ink); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
.topbar nav a.active, .topbar nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
.demo-bar {
  margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  font-size: 13px; color: var(--topbar-ink);
}
.demo-bar strong { color: #fff; font-size: 16px; font-variant-numeric: tabular-nums; }
.demo-bar button { padding: 4px 10px; font-size: 13px; background: var(--topbar-btn); color: #fff; border: 1px solid var(--topbar-line); }
.demo-bar button.ghost { background: transparent; }
.demo-group { display: inline-flex; gap: 4px; align-items: center; }

/* Buttons */
button, .btn {
  font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--crit); border-color: var(--crit-line); }
button.success { background: var(--ok); color: var(--panel); border-color: var(--ok); font-weight: 600; }
button:disabled { opacity: .5; cursor: not-allowed; }

/* Panels and chips */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.chip.open { background: var(--crit-bg); color: var(--crit); }
.chip.acknowledged { background: var(--warn-bg); color: var(--warn); }
.chip.closed { background: var(--ok-bg); color: var(--ok); }
.chip.sent { background: var(--info-bg); color: var(--accent); }
.chip.rejected, .chip.superseded { background: var(--soft); color: var(--muted); }
.chip.red { background: var(--crit); color: var(--panel); }
.timer { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.t-ok { color: var(--ok); }
.t-warn { color: var(--warn); }
.t-crit { color: var(--crit); }

/* Lab layout */
.lab > * { min-width: 0; }
.lab { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
.queue { display: flex; flex-direction: column; gap: 8px; }
.queue-item { text-align: left; display: block; width: 100%; padding: 12px; }
.queue-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(31,95,191,.2); }
.queue-item .row { display: flex; justify-content: space-between; gap: 8px; }
.queue-item .val { color: var(--crit); font-weight: 700; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

.result-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.value { font-size: 26px; font-weight: 700; color: var(--crit); margin: 4px 0; }
.timer-box { text-align: right; }
.timer-box .timer { font-size: 28px; display: block; }

.coverage { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-top: 16px; }
.cov-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--panel); }
.cov-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.cov-card .name { font-size: 20px; font-weight: 700; margin: 2px 0; }
.cov-card.covering { border: 2px solid var(--accent); background: var(--covering-bg); }
.cov-card.warn { border-color: var(--warn); background: var(--warn-bg); }
.cov-card.match { border-color: var(--ok); background: var(--ok-bg); }
.cov-card .reason { font-size: 13px; color: var(--muted); margin-top: 4px; }
.cov-card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.side-stack { display: flex; flex-direction: column; gap: 12px; }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.table-wrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.loop { border-radius: var(--radius); padding: 14px; border: 1px dashed var(--line); }
.loop.ok { border: 1px solid var(--ok); background: var(--ok-bg); }
.loop.bad { border: 1px solid var(--crit); background: var(--crit-bg); }

.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.timeline .t { font-variant-numeric: tabular-nums; color: var(--muted); }
.timeline li.escalation, .timeline li.rerouted { color: var(--warn); }
.timeline li.red, .timeline li.breach { color: var(--crit); font-weight: 600; }
.timeline li.ack, .timeline li.closed { color: var(--ok); }

.banner { padding: 10px 14px; border-radius: 8px; margin-top: 12px; font-weight: 600; }
.banner.red { background: var(--crit); color: var(--panel); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }

/* Clinician phone */
.phone-wrap { display: flex; justify-content: center; padding: 20px; }
.phone { width: 390px; max-width: 100%; background: #0f1724; border-radius: 36px; padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.phone-screen { background: var(--bg); border-radius: 26px; min-height: 680px; overflow: hidden; }
.phone-head { background: var(--panel); padding: 14px 16px; border-bottom: 1px solid var(--line); }
.phone-head select { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); margin-top: 6px; }
.phone-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.alert-card { background: var(--panel); border-radius: 14px; padding: 14px; border-left: 6px solid var(--crit); box-shadow: 0 1px 3px var(--shadow); }
.alert-card.done { border-left-color: var(--line); opacity: .8; }
.alert-card .value { font-size: 22px; }
.alert-card input { width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); margin: 8px 0; }
.alert-card .actions { display: flex; gap: 8px; }
.alert-card .actions button { flex: 1; justify-content: center; }

/* Supervisor */
.sup { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile .big { font-size: 28px; font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; min-width: 120px; }
.bar > span { display: block; height: 100%; }
tr.red-row { background: var(--crit-bg); }

/* Landing */
.landing { max-width: 860px; margin: 32px auto; padding: 0 20px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.cards a { text-decoration: none; color: inherit; }
.cards .panel:hover { border-color: var(--accent); }
ol.script li { margin-bottom: 6px; }

#toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.toast { background: var(--topbar); color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.toast.error { background: var(--crit); }

@media (max-width: 900px) {
  .lab { grid-template-columns: 1fr; }
  .coverage { grid-template-columns: 1fr; }
  .tiles, .cards { grid-template-columns: 1fr 1fr; }
  .demo-bar { margin-left: 0; }
}
@media (max-width: 520px) {
  .tiles, .cards { grid-template-columns: 1fr; }
  .coverage[style] { grid-template-columns: 1fr !important; }
  .lab, .sup { padding-left: 16px; padding-right: 16px; }
}

'use strict';

const { hhmm, within } = require('./time');

/**
 * Works out who is responsible for a patient at time `now`.
 *
 * Order of precedence:
 *   1. An active procedure or consult coverage window on the treatment team.
 *   2. The clinician on call (level 1) for the patient's primary service.

  const patient = data.patients.find((p) => p.mrn === mrn);
  if (!patient) throw new Error(`Unknown patient ${mrn}`);

  const clinician = (id) => data.clinicians.find((c) => c.id === id) || null;
  const serviceName = (s) => data.services[s] || s;
  const onCall = (service, level) =>
    data.callSchedule.find((c) => c.service === service && c.level === level && within(t, c.start, c.end));
  const contact = (entry, reason) => (entry ? { clinician: clinician(entry.clinicianId), reason } : null);

  const svc = patient.primaryService;
  const special = data.treatmentTeam
    .filter((e) => e.mrn === mrn && e.role in ROLE_RANK && within(t, e.start, e.end))
    .sort((a, b) => ROLE_RANK[a.role] - ROLE_RANK[b.role])[0];

  let primary;
  let backup;
  if (special) {
    const kind = special.role === 'procedure' ? 'Procedure' : 'Consult';
    primary = contact(
      special,
      `${kind} coverage: ${special.note} (${hhmm(special.start)}–${hhmm(special.end)}) overrides the primary team`

    backup = contact(team, `Primary team on call: ${serviceName(svc)} (${team && hhmm(team.start)}–${team && hhmm(team.end)})`);

    primary = contact(p, p && `On call for ${serviceName(svc)} (${hhmm(p.start)}–${hhmm(p.end)})`);

    backup = contact(b, b && `Backup on call for ${serviceName(svc)} (${hhmm(b.start)}–${hhmm(b.end)})`);

<script>/* Shared helpers for all CritCall views. */
const CC = (() => {
  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const hhmm = (iso) => (iso ? new Date(iso).toISOString().slice(11, 16) : '');

  const mmss = (minutes) => {
    const neg = minutes < 0;
    const s = Math.abs(Math.round(minutes * 60));
    return `${neg ? '-' : ''}${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  const TARGET_LABEL = { primary: 'Covering', backup: 'Backup', chargeNurse: 'Charge nurse' };

  function toast(message, kind = 'info') {
    let host = document.getElementById('toasts');
    if (!host) {
      host = document.createElement('div');
      host.id = 'toasts';
      document.body.appendChild(host);
    }
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  // How the views talk to the demo backend. The standalone build sets window.CC_TRANSPORT
  // to run the same backend code inside the page instead of over HTTP.
  const transport = window.CC_TRANSPORT || {
    async post(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      return { ok: res.ok, data: await res.json().catch(() => ({})), statusText: res.statusText };
    },
    subscribe(onState) {
      const es = new EventSource('/api/events');
      es.onmessage = (e) => onState(JSON.parse(e.data));
      return () => es.close();
    },
  };

  async function api(path, body) {
    const { ok, data, statusText } = await transport.post(path, body);
    if (!ok) {
      toast(data.error || statusText, 'error');
      throw new Error(data.error || statusText);
    }
    return data;
  }

  /**
   * Subscribes to live state. `render(state)` runs when something structural changes;
   * timers ([data-deadline], [data-since]) are refreshed every second without re-rendering,
   * so inputs keep their contents.
   */
  function live(render, signatureExtra = () => '') {
    let lastSig = null;
    let lastState = null;
    const sig = (s) =>
      JSON.stringify(
        s.results.map((r) => [r.id, r.status, r.events.length, r.coverage.primary?.clinician.id, r.notifications.map((n) => n.status)])
      ) + signatureExtra();

    function update(state, force) {
      lastState = state;
      const s = sig(state);
      if (force || s !== lastSig) {
        lastSig = s;
        render(state);
      }
      tickTimers(state);
      const clock = document.getElementById('clock');
      if (clock) clock.textContent = hhmm(state.now);
    }

    transport.subscribe((state) => update(state));
    return { rerender: () => lastState && update(lastState, true), state: () => lastState };
  }

  function tickTimers(state) {
    const now = Date.parse(state.now);
    document.querySelectorAll('[data-deadline]').forEach((el) => {
      const left = (Date.parse(el.dataset.deadline) - now) / 60000;
      el.textContent = left >= 0 ? `${mmss(left)} left` : `${mmss(-left)} over`;
      el.classList.toggle('t-ok', left > 15);
      el.classList.toggle('t-warn', left <= 15 && left > 5);
      el.classList.toggle('t-crit', left <= 5);
    });
    document.querySelectorAll('[data-since]').forEach((el) => {
      el.textContent = mmss((now - Date.parse(el.dataset.since)) / 60000);
    });
  }

  /** Demo controls: post scenario results, fast-forward the clock, reset. */
  function demoBar(el) {
    el.innerHTML = `
      <span class="clock-wrap">Demo clock <strong id="clock">--:--</strong></span>
      <span class="demo-group">Post critical result:
        <button data-scn="A" title="Ordering provider is off shift">A</button>
        <button data-scn="B" title="No answer, escalation runs">B</button>
        <button data-scn="C" title="Procedure team is covering">C</button>
      </span>
      <span class="demo-group">Fast-forward:
        <button data-adv="5">+5 min</button>
        <button data-adv="10">+10 min</button>
      </span>
      <button data-reset class="ghost">Reset demo</button>`;
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.scn) {
        await api('/api/results', { scenario: b.dataset.scn });
        toast(`Scenario ${b.dataset.scn}: critical result posted`);
      } else if (b.dataset.adv) {
        await api('/api/clock/advance', { minutes: Number(b.dataset.adv) });
      } else if (b.hasAttribute('data-reset')) {
        await api('/api/reset');
        toast('Demo reset');
      }
    });
  }

  function nav(active) {
    const links = [
      ['lab.html', 'Lab tech'],
      ['clinician.html', 'Clinician phone'],
      ['supervisor.html', 'Supervisor'],
    ];
    return `<a class="brand" href="/">CritCall</a><nav>${links
      .map(([href, label]) => `<a href="${href}" class="${href === active ? 'active' : ''}">${label}</a>`)
      .join('')}</nav>`;
  }

  return { esc, hhmm, mmss, toast, api, live, demoBar, nav, TARGET_LABEL };
})();

      <div class="side-stack">${orderingCard}</div>
    </div>
    <div class="coverage" style="grid-template-columns:1fr 1fr">${otherCard('backup')}${otherCard('chargeNurse')}</div>
    <h3>Notifications</h3><div class="table-wrap">${notifRows}</div>
    <h3>Closed loop</h3>${loop}
    <h3>Audit timeline</h3>
    <ul class="timeline">${r.events.map((e) => `<li class="${e.type}"><span class="t">${hhmm(e.at)}</span><span>${esc(e.text)}</span></li>`).join('')}</ul>`;
}

document.getElementById('detail').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || !selectedId) return;
  if (b.dataset.notify) {
    await api(`/api/results/${selectedId}/notify`, { target: b.dataset.notify, channel: 'message' });
    toast('Secure message sent');
  } else if (b.dataset.call) {
    await api(`/api/results/${selectedId}/notify`, { target: b.dataset.call, channel: 'call' });
    toast('Call placed and logged');
  } else if (b.dataset.wrong) {
    await api(`/api/notifications/${b.dataset.wrong}/wrong-person`, { reason: 'Lab: not covering this patient' });
    toast('Re-routed to the next contact');
  } else if (b.dataset.close) {
    await api(`/api/results/${b.dataset.close}/close`);
    toast('Result closed');
  }
});

    },
  },
  clinician: {
    html: "<header class=\"topbar\"><span id=\"nav\"></span><div class=\"demo-bar\"><span>Demo clock <strong id=\"clock\">--:--</strong></span></div></header>\n  <div class=\"phone-wrap\">\n    <div class=\"phone\">\n      <div class=\"phone-screen\">\n        <div class=\"phone-head\">\n          <div class=\"small muted\">Signed in as</div>\n          <select id=\"who\"></select>\n        </div>\n        <div class=\"phone-body\" id=\"alerts\"></div>\n      </div>\n    </div>\n  </div>",
    run() {
const { esc, hhmm, api, toast, TARGET_LABEL } = CC;

document.getElementById('nav').outerHTML = CC.nav('clinician.html');

const select = document.getElementById('who');
let me = new URLSearchParams(location.search).get('id') || 'nguyen';

const live = CC.live(render, () => me);

select.addEventListener('change', () => {
  me = select.value;
  try {
    history.replaceState(null, '', `?id=${encodeURIComponent(me)}`);
  } catch {
    // Not allowed in some embedded frames; the selection still works.
  }
  live.rerender();
});

function render(state) {
  if (!select.options.length) {
    select.innerHTML = state.clinicians
      .map((c) => `<option value="${esc(c.id)}">${esc(c.name)}, ${esc(c.role)}</option>`)
      .join('');
  }
  select.value = me;

  const mine = [];
  for (const r of state.results) {
    for (const n of r.notifications) if (n.recipientId === me) mine.push({ r, n });
  }
  mine.sort((a, b) => (a.n.status === 'sent' ? 0 : 1) - (b.n.status === 'sent' ? 0 : 1) || b.n.sentAt.localeCompare(a.n.sentAt));

  const host = document.getElementById('alerts');
  if (!mine.length) {
    host.innerHTML = `<div class="empty">No critical result alerts.</div>`;
    return;
  }
  host.innerHTML = mine.map(({ r, n }) => card(r, n)).join('');
}

function card(r, n) {
  const p = r.coverage.patient;
  const pending = n.status === 'sent';
  const statusText = {
    acknowledged: `You acknowledged at ${hhmm(n.ackAt)}`,
    superseded: 'Acknowledged by another clinician',
    rejected: 'You marked this as wrong person',
  }[n.status];
  return `<div class="alert-card ${pending ? '' : 'done'}">
    <div class="mini"><span class="chip open">CRITICAL RESULT</span><span class="small muted">${hhmm(n.sentAt)}</span></div>
    <div style="margin-top:8px"><strong>${esc(p.name)}</strong> <span class="small muted">${esc(p.bed)} · MRN ${esc(p.mrn)}</span></div>
    <div class="value">${esc(r.test)}: ${esc(r.value)} ${esc(r.units)}</div>
    <div class="small muted">Ref ${esc(r.refRange)} · resulted ${hhmm(r.resultedAt)}</div>
    <div class="small" style="margin-top:6px">Sent to you as <strong>${TARGET_LABEL[n.target]}</strong>: ${esc(n.reason)}</div>
    ${
      pending
        ? `<div class="small" style="margin-top:8px">Policy timer: <span class="timer" data-deadline="${r.deadline}"></span></div>
           <input data-rb="${n.id}" placeholder="Read back the value, e.g. ${esc(r.value)} ${esc(r.units)}" autocomplete="off">
           <div class="actions">
             <button class="success" data-ack="${n.id}">Acknowledge</button>
             <button class="danger" data-wrong="${n.id}">Not my patient</button>
           </div>`
        : `<div class="small muted" style="margin-top:8px">${statusText}</div>`
    }
  </div>`;
}

document.getElementById('alerts').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ack) {
    const input = document.querySelector(`[data-rb="${b.dataset.ack}"]`);
    if (!input.value.trim()) {
      toast('Read back the value to acknowledge', 'error');
      input.focus();
      return;
    }
    await api(`/api/notifications/${b.dataset.ack}/ack`, { readBack: input.value });
    toast('Acknowledged. The lab can see your read-back.');
  } else if (b.dataset.wrong) {
    await api(`/api/notifications/${b.dataset.wrong}/wrong-person`, { reason: 'Clinician: not my patient' });
    toast('Sent back to the lab and re-routed');
  }
});

    },
  },
  supervisor: {
    html: "<header class=\"topbar\"><span id=\"nav\"></span><div class=\"demo-bar\" id=\"demo\"></div></header>\n  <main class=\"sup\">\n    <div class=\"tiles\" id=\"tiles\"></div>\n    <section class=\"panel\">\n      <h3 style=\"margin-top:0\">Open critical results</h3>\n      <div id=\"open\"></div>\n    </section>\n    <section class=\"panel\">\n      <h3 style=\"margin-top:0\">Acknowledged and closed</h3>\n      <div id=\"done\"></div>\n    </section>\n  </main>",
    run() {
const { esc, hhmm, mmss } = CC;

document.getElementById('nav').outerHTML = CC.nav('supervisor.html');
CC.demoBar(document.getElementById('demo'));

const STEP_LABEL = ['Covering clinician', 'Backup notified', 'Charge nurse + supervisor', 'RED FLAG'];
const name = (state, id) => (state.clinicians.find((c) => c.id === id) || { name: id }).name;

// Re-render every second here: the time bars are the point of this view and it has no inputs.
CC.live(render, () => String(Date.now() / 1000 | 0));

function render(state) {
  const now = Date.parse(state.now);
  const open = state.results.filter((r) => r.status === 'open');
  const done = state.results.filter((r) => r.status !== 'open');
  const acks = done.map((r) => r.ack.minutesToAck);
  const avg = acks.length ? acks.reduce((a, b) => a + b, 0) / acks.length : null;
  const misroutes = state.results.reduce((n, r) => n + r.notifications.filter((x) => x.status === 'rejected').length, 0);
  const breaches = state.results.filter((r) => r.breached).length;

  document.getElementById('tiles').innerHTML = [
    ['Open critical results', open.length],
    ['Avg time to acknowledge', avg === null ? '–' : mmss(avg)],
    ['Wrong-person re-routes', misroutes],
    ['30-min policy breaches', breaches],
  ]
    .map(([label, v]) => `<div class="panel tile"><div class="small muted">${label}</div><div class="big">${v}</div></div>`)
    .join('');

  document.getElementById('open').innerHTML = open.length
    ? `<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Result</th><th>Covering now</th><th>Contacted</th><th>Stage</th><th>Time left</th></tr></thead><tbody>${open
        .map((r) => {
          const left = (Date.parse(r.deadline) - now) / 60000;
          const pct = Math.max(0, Math.min(100, (left / state.policyMinutes) * 100));
          const color = left > 15 ? 'var(--ok)' : left > 5 ? 'var(--warn)' : 'var(--crit)';
          return `<tr class="${r.redFlag ? 'red-row' : ''}">
            <td><strong>${esc(r.coverage.patient.name)}</strong><div class="small muted">${esc(r.coverage.patient.bed)}</div></td>
            <td>${esc(r.test)} <strong>${esc(r.value)}</strong> ${esc(r.units)}</td>
            <td>${esc(r.coverage.primary ? r.coverage.primary.clinician.name : 'None found')}</td>
            <td>${r.notifications.length ? r.notifications.map((n) => esc(name(state, n.recipientId))).join(', ') : '<span class="chip open">Nobody yet</span>'}</td>
            <td>${r.redFlag ? '<span class="chip red">RED FLAG</span>' : esc(STEP_LABEL[r.escalationStep])}</td>
            <td><span class="timer" data-deadline="${r.deadline}"></span><div class="bar"><span style="width:${pct}%;background:${color}"></span></div></td>
          </tr>`;
        })
        .join('')}</tbody></table></div>`
    : `<p class="muted">None. Every critical result has been acknowledged.</p>`;

  document.getElementById('done').innerHTML = done.length
    ? `<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Result</th><th>Acknowledged by</th><th>Time to ack</th><th>Read-back</th><th>Status</th></tr></thead><tbody>${done
        .map(
          (r) => `<tr>
            <td>${esc(r.coverage.patient.name)}</td>
            <td>${esc(r.test)} ${esc(r.value)}</td>
            <td>${esc(name(state, r.ack.by))} at ${hhmm(r.ack.at)}</td>
            <td class="timer ${r.ack.minutesToAck <= 30 ? 't-ok' : 't-crit'}">${mmss(r.ack.minutesToAck)}</td>
            <td>${r.ack.matches ? 'Matches' : '<span class="t-crit">Mismatch</span>'}</td>
            <td><span class="chip ${r.status}">${r.status === 'closed' ? 'Closed' : 'Read-back pending'}</span></td>
          </tr>`
        )
        .join('')}</tbody></table></div>`
    : `<p class="muted">None yet.</p>`;
}

    },
  },
};

// Each view is mounted into #app; links to *.html switch views instead of loading pages.
function mount(name) {
  if (!VIEWS[name]) name = 'home';
  window.CC_RESET_SUBSCRIBERS();
  document.getElementById('app').innerHTML = VIEWS[name].html;
  VIEWS[name].run();
  window.scrollTo(0, 0);
  try {
    history.replaceState(null, '', '#' + name);
  } catch {
    // Some embedded frames refuse history changes; navigation still works.
  }
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const m = a.getAttribute('href').match(/^\/?(?:(\w+)\.html)?(?:\?.*)?$/);
  if (!m) return;
  e.preventDefault();
  mount(!m[1] || m[1] === 'index' ? 'home' : m[1]);
});
window.addEventListener('hashchange', () => mount(location.hash.slice(1)));
mount(location.hash.slice(1));</script>
</body>
</html>
